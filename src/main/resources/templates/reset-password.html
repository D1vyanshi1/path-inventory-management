<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Reset Password</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          th:href="@{/app.css}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* ================= HEADER ================= */

        .app-header {
            width: 100%;
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e1e7ee;

            display: flex;
            align-items: center;

            padding: 0 50px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .path-logo {
            width: 72px;
            height: auto;
            object-fit: contain;
        }

        .header-title {
            color: #163f70;
            font-size: 28px;
            font-weight: 700;
        }


        /* ================= NAVBAR ================= */

        .main-navbar {
            width: 100%;
            height: 70px;

            background: #ffffff;
            border-bottom: 1px solid #e1e7ee;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 68px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 42px;
        }

        .nav-link {
            color: #3f5872;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            white-space: nowrap;
            transition: 0.2s;
        }

        .nav-link:hover {
            color: #1976d2;
        }

        .logout-link {
            color: #e53935;
        }

        .logout-link:hover {
            color: #c62828;
        }


        /* ================= MAIN ================= */

        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        /* ================= PAGE ================= */

        .reset-container {

            width: 100%;
            max-width: 650px;

            margin: 55px auto 65px;

            padding: 0 20px;
        }


        /* ================= FORM CARD ================= */

        .form-card {

            width: 100%;

            background: #ffffff;

            border: 1px solid #dfe6ee;

            border-radius: 16px;

            padding: 36px 42px;

            box-shadow:
                    0 6px 20px rgba(29, 53, 87, 0.10);
        }


        .form-card h2 {

            margin: 0 0 8px;

            color: #1d426d;

            font-size: 30px;

            font-weight: 700;
        }


        .form-description {

            margin: 0 0 28px;

            color: #71859b;

            font-size: 16px;

            line-height: 1.5;
        }


        /* ================= ALERTS ================= */

        .success {

            background: #edf8f1;

            border: 1px solid #cce9d5;

            color: #237a3d;

            padding: 12px 14px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: 600;
        }


        .error {

            background: #fff1f1;

            border: 1px solid #f3cccc;

            color: #c62828;

            padding: 12px 14px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: 600;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #173d68;

            font-size: 15px;

            font-weight: 600;
        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #d7e1eb;

            border-radius: 8px;

            background: #ffffff;

            color: #26384d;

            font-size: 15px;

            transition: 0.2s;
        }


        input::placeholder {

            color: #9aaabd;
        }


        input:focus {

            outline: none;

            border-color: #1976d2;

            box-shadow:
                    0 0 0 3px rgba(25, 118, 210, 0.10);
        }


        /* ================= BUTTONS ================= */

        .form-actions {

            display: flex;

            gap: 12px;

            margin-top: 24px;
        }


        .btn {

            height: 46px;

            padding: 0 25px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 600;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-primary {

            background: #1976d2;

            color: #ffffff;
        }


        .btn-primary:hover {

            background: #1565c0;
        }


        .btn-secondary {

            background: #edf1f5;

            color: #526579;
        }


        .btn-secondary:hover {

            background: #e2e7ed;
        }


        /* ================= FOOTER ================= */

        .app-footer {

            width: 100%;

            min-height: 64px;

            background: #ffffff;

            border-top: 1px solid #e1e7ee;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .footer-content {

            color: #71859b;

            font-size: 15px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .app-header {
                padding: 0 20px;
            }

            .header-title {
                font-size: 21px;
            }

            .main-navbar {

                height: auto;

                min-height: 65px;

                padding: 15px 20px;
            }

            .navbar-left {

                gap: 18px;

                flex-wrap: wrap;
            }

            .nav-link {
                font-size: 15px;
            }

            .reset-container {

                margin-top: 35px;

                padding: 0 15px;
            }

            .form-card {

                padding: 28px 22px;
            }

            .form-card h2 {

                font-size: 26px;
            }

            .form-actions {

                flex-direction: column;
            }

            .btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div th:replace="~{fragments/header :: header}"></div>




<!-- ================= MAIN ================= -->

<main>

    <div class="reset-container">

        <div class="form-card">


            <h2>
                Reset Password
            </h2>


            <p class="form-description">
                Enter your account details and choose a new password.
            </p>


            <!-- ERROR -->

            <div th:if="${error}"
                 class="error"
                 th:text="${error}">
            </div>


            <!-- SUCCESS -->

            <div th:if="${success}"
                 class="success"
                 th:text="${success}">
            </div>


            <form th:action="@{/reset-password}"
                  method="post">


                <!-- USERNAME -->

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                            type="text"
                            name="username"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                </div>


                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label>
                        Current Password
                    </label>

                    <input
                            type="password"
                            name="currentPassword"
                            placeholder="Enter current password"
                            autocomplete="current-password"
                            required>

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                            type="password"
                            name="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                            type="password"
                            name="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            required>

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <button
                            type="submit"
                            class="btn btn-primary">

                        Reset Password

                    </button>


                    <a
                            th:href="@{/login}"
                            class="btn btn-secondary">

                        Cancel

                    </a>

                </div>


            </form>


        </div>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>


</body>

</html>
