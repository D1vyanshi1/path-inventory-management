<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Forgot Password</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          th:href="@{/app.css}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* ================= HEADER ================= */

        .app-header {
            width: 100%;
            height: 72px;

            background: #ffffff;
            border-bottom: 1px solid #e1e7ee;

            display: flex;
            align-items: center;

            padding: 0 50px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .path-logo {
            width: 72px;
            height: auto;
            object-fit: contain;
        }

        .header-title {
            color: #163f70;
            font-size: 28px;
            font-weight: 700;
        }


        /* ================= MAIN ================= */

        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        /* ================= CONTAINER ================= */

        .forgot-container {

            width: 100%;

            max-width: 520px;

            margin: 75px auto 65px;

            padding: 0 20px;
        }


        /* ================= CARD ================= */

        .form-card {

            width: 100%;

            background: #ffffff;

            border: 1px solid #dfe6ee;

            border-radius: 16px;

            padding: 38px 42px;

            box-shadow:
                    0 6px 20px rgba(29, 53, 87, 0.10);
        }


        .form-card h2 {

            margin: 0 0 8px;

            text-align: center;

            color: #1d426d;

            font-size: 30px;

            font-weight: 700;
        }


        .form-description {

            margin: 0 0 30px;

            text-align: center;

            color: #71859b;

            font-size: 16px;

            line-height: 1.5;
        }


        /* ================= ERROR ================= */

        .error {

            background: #fff1f1;

            border: 1px solid #f3cccc;

            color: #c62828;

            padding: 12px 14px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;

            font-weight: 600;

            text-align: center;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #173d68;

            font-size: 15px;

            font-weight: 600;
        }


        input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border: 1px solid #d7e1eb;

            border-radius: 8px;

            background: #ffffff;

            color: #26384d;

            font-size: 15px;

            transition: 0.2s;
        }


        input::placeholder {

            color: #9aaabd;
        }


        input:focus {

            outline: none;

            border-color: #1976d2;

            box-shadow:
                    0 0 0 3px rgba(25, 118, 210, 0.10);
        }


        /* ================= BUTTON ================= */

        .btn-primary {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 8px;

            background: #1976d2;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-primary:hover {

            background: #1565c0;
        }


        /* ================= BACK LINK ================= */

        .back-link {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #1976d2;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;
        }


        .back-link:hover {

            text-decoration: underline;
        }


        /* ================= FOOTER ================= */

        .app-footer {

            width: 100%;

            min-height: 64px;

            background: #ffffff;

            border-top: 1px solid #e1e7ee;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .footer-content {

            color: #71859b;

            font-size: 15px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .app-header {

                padding: 0 20px;
            }

            .header-title {

                font-size: 21px;
            }

            .forgot-container {

                margin-top: 40px;

                padding: 0 15px;
            }

            .form-card {

                padding: 30px 22px;
            }

            .form-card h2 {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div th:replace="~{fragments/header :: header}"></div>


<!-- ================= MAIN ================= -->

<main>

    <div class="forgot-container">

        <div class="form-card">


            <h2>
                Forgot Password
            </h2>


            <p class="form-description">
                Enter your username and registered email to continue.
            </p>


            <!-- ERROR -->

            <div th:if="${error}"
                 class="error"
                 th:text="${error}">
            </div>


            <form th:action="@{/forgot-password}"
                  method="post">


                <!-- USERNAME -->

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Registered Email
                    </label>

                    <input
                            type="email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required>

                </div>


                <!-- BUTTON -->

                <button
                        type="submit"
                        class="btn-primary">

                    Send OTP

                </button>


            </form>


            <a
                    th:href="@{/login}"
                    class="back-link">

                ← Back to Login

            </a>


        </div>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>


</body>

</html>
