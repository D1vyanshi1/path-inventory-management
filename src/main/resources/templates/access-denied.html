<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Access Denied</title>

    <link rel="stylesheet" th:href="@{/app.css}">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            text-align: center;
            margin-top: 120px;
        }

        h1 {
            color: #dc3545;
            font-size: 36px;
        }

        p {
            color: #dc3545;
            font-size: 20px;
            font-weight: 600;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #125ca1;
        }

    </style>

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h1>Access Denied</h1>

    <p>
        You do not have permission to perform this action.
    </p>

    <a href="/dashboard" class="back-btn">
        Back to Dashboard
    </a>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
